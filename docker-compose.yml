name: miuni

services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        PG_MAJOR: "16"
        PGVECTOR_IMAGE: pgvector/pgvector:0.8.6-pg16-bookworm
    image: miuni/postgres-rag:16
    container_name: miuni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MIUNI_POSTGRES_DB:?Define MIUNI_POSTGRES_DB en .env}
      POSTGRES_USER: ${MIUNI_POSTGRES_USER:?Define MIUNI_POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${MIUNI_POSTGRES_PASSWORD:?Define MIUNI_POSTGRES_PASSWORD en .env}
    ports:
      - "${MIUNI_POSTGRES_PORT:?Define MIUNI_POSTGRES_PORT en .env}:5432"
    volumes:
      - miuni-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  miuni-postgres-data:
