<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">MiUni: campus, rutas y lugares</title>
  <desc id="desc">Ilustración plana de un campus universitario con edificios, ruta y puntos de ubicación.</desc>
  <style>
    .route { stroke-dasharray: 14 12; animation: travel 4s linear infinite; }
    .pin { transform-box: fill-box; transform-origin: center bottom; animation: pin 2.8s ease-in-out infinite; }
    .pin.two { animation-delay: -1.2s; }
    .pin.three { animation-delay: -2s; }
    .window { fill: #dce7ff; }
    @keyframes travel { to { stroke-dashoffset: -52; } }
    @keyframes pin { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  </style>

